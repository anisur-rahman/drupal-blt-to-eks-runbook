name: Validate and build
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax (when PHP available)
        run: |
          php -l web/sites/sites.php
          php -l web/sites/site_a/settings.php
          php -l web/sites/site_b/settings.php
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build container
        run: docker build -t drupal-multisite:ci .
      - name: Helm lint and template
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm lint helm/drupal
          helm template drupal helm/drupal -n drupal > /tmp/drupal.yaml
