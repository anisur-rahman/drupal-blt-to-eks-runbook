# Runbook Phase 9: nginx in front of PHP-FPM in the same pod (127.0.0.1:9000).
server {
  listen 8080;
  server_name _;
  root /var/www/html/web;
  index index.php;
  client_max_body_size 64m;
  server_tokens off;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Never serve private files, dotfiles, or PHP/config sources directly.
  location ~ ^/sites/.*/private/ { return 403; }
  location ~ (^|/)\. { return 403; }
  location ~* \.(engine|inc|install|make|module|profile|po|sh|sql|theme|twig|tpl(\.php)?|xtmpl|yml|yaml)$ { return 403; }
  location ~ ^/sites/[^/]+/files/.*\.php$ { return 403; }
  location ~ ^/(vendor|config)/ { return 404; }

  location / { try_files $uri /index.php?$query_string; }

  # Image styles and aggregated CSS/JS are generated by Drupal on first request.
  location ~ ^/sites/[^/]+/files/(styles|css|js)/ { try_files $uri @drupal; }
  location @drupal { rewrite ^ /index.php last; }

  # Only Drupal's front controllers are executed.
  location ~ ^/(index|update|core/install|core/rebuild|core/authorize)\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_PROXY "";
    # Do NOT set HTTPS from X-Forwarded-Proto here: "HTTPS=http" counts as on in PHP, and the
    # header is client-controlled. Drupal reads it only from TRUSTED_PROXY_IPS (settings.shared.php).
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_read_timeout 120s;
  }
  location ~ \.php(/|$) { return 404; }
}
