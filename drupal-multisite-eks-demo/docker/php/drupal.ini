; Runbook Phase 9 PHP settings
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
expose_php = Off
; Drupal's .htaccess/nginx can't change zend.assertions at runtime; -1 (production) logs a warning.
zend.assertions = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; Code is immutable in the image, so never re-check file timestamps.
opcache.validate_timestamps = 0
