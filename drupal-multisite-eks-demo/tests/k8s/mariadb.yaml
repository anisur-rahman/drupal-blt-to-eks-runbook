# Test-only database for the kind smoke test (stands in for RDS). Not for production.
apiVersion: apps/v1
kind: Deployment
metadata: {name: mariadb, labels: {app: mariadb}}
spec:
  selector: {matchLabels: {app: mariadb}}
  template:
    metadata: {labels: {app: mariadb}}
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - {name: MARIADB_DATABASE, value: site_a}
            - {name: MARIADB_USER, value: drupal}
            - name: MARIADB_PASSWORD
              valueFrom: {secretKeyRef: {name: drupal-db, key: password}}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: drupal-db, key: root-password}}
          ports: [{containerPort: 3306}]
          readinessProbe:
            exec: {command: ["healthcheck.sh", "--connect", "--innodb_initialized"]}
            periodSeconds: 5
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: data, mountPath: /var/lib/mysql}
      volumes:
        - name: init
          configMap: {name: db-init}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: mariadb}
spec:
  selector: {app: mariadb}
  ports: [{port: 3306}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: drupal-public-files}
spec:
  accessModes: [ReadWriteOnce]   # kind has one node; EKS uses ReadWriteMany on EFS
  resources: {requests: {storage: 1Gi}}
