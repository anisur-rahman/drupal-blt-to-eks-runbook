apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  # No replicas here: the HPA owns scaling.
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      securityContext:
        fsGroup: 33   # www-data in the php:apache image, so Drupal can write public files
      containers:
        - name: drupal
          image: {{ include "drupal.image" . | quote }}
          ports: [{containerPort: 80}]
          env:
            {{- include "drupal.env" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /user/login
              port: 80
              httpHeaders: [{name: Host, value: {{ (index .Values.sites 0).host | quote }}}]
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: 80}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            {{- range .Values.sites }}
            - name: public-files
              mountPath: /var/www/html/web/sites/{{ .id }}/files
              subPath: {{ .id }}
            {{- end }}
      volumes:
        - name: public-files
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
