{{- range .Values.sites }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-cron-{{ .id | replace "_" "-" }}
spec:
  schedule: {{ $.Values.cron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 33
          containers:
            - name: cron
              image: {{ include "drupal.image" $ | quote }}
              command: ["vendor/bin/drush", "--uri=https://{{ .host }}", "cron"]
              env:
                {{- include "drupal.env" $ | nindent 16 }}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - name: public-files
                  mountPath: /var/www/html/web/sites/{{ .id }}/files
                  subPath: {{ .id }}
          volumes:
            - name: public-files
              persistentVolumeClaim:
                claimName: {{ $.Values.persistence.existingClaim }}
{{- end }}
