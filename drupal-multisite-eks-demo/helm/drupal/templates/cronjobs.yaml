{{- range .Values.sites }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-cron-{{ .id | replace "_" "-" }}
spec:
  schedule: {{ $.Values.cron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: {job: cron, site: {{ .id | replace "_" "-" }}}
        spec:
          restartPolicy: Never
          {{- include "drupal.podSecurity" $ | nindent 10 }}
          containers:
            - name: cron
              image: {{ include "drupal.image" (list $ "app") | quote }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: ["drush", "--uri=https://{{ .host }}", "cron"]
              envFrom:
                {{- include "drupal.envFrom" $ | nindent 16 }}
              {{- include "drupal.containerSecurity" $ | nindent 14 }}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                {{- include "drupal.fileMounts" (list $ .id) | nindent 16 }}
          volumes:
            - name: files
              persistentVolumeClaim:
                claimName: {{ $.Values.persistence.existingClaim }}
{{- end }}
