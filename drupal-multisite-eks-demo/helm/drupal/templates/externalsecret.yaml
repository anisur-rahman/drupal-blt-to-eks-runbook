{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.storeKind }}
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.existingSecret }}
  data:
    {{- range .Values.sites }}
    {{- $key := printf "%s/%s" $.Values.externalSecrets.keyPrefix .id }}
    - {secretKey: {{ .id | upper }}_DB_USER, remoteRef: {key: {{ $key }}, property: db_user}}
    - {secretKey: {{ .id | upper }}_DB_PASSWORD, remoteRef: {key: {{ $key }}, property: db_password}}
    - {secretKey: {{ .id | upper }}_HASH_SALT, remoteRef: {key: {{ $key }}, property: hash_salt}}
    {{- end }}
{{- end }}
