name: Demo – validate, build and smoke test

on:
  push:
    branches: [main]
    paths:
      - "drupal-multisite-eks-demo/**"
      - ".github/workflows/demo-validate.yml"
  pull_request:
    paths:
      - "drupal-multisite-eks-demo/**"
      - ".github/workflows/demo-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit bash runs with -eo pipefail, so `script | tee log` fails when the script fails.
    shell: bash
    working-directory: drupal-multisite-eks-demo

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: find web/sites -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: ShellCheck
        run: find . -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Site-to-database mapping validator
        run: |
          tests/site-databases/run.sh
          scripts/validate-site-databases.sh --sites "site_a site_b" migration/site-databases.example.csv

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint and Kubernetes schema validation
        run: |
          helm lint helm/drupal --set ingress.enabled=true
          helm template drupal helm/drupal --set ingress.enabled=true > "$RUNNER_TEMP/drupal.yaml"
          docker run --rm -v "$RUNNER_TEMP/drupal.yaml:/drupal.yaml:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /drupal.yaml

  compose:
    name: Docker Compose smoke test
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, install both sites and test
        run: tests/compose/smoke.sh 2>&1 | tee "$RUNNER_TEMP/compose-smoke.log"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke-log
          path: ${{ runner.temp }}/compose-smoke.log

  kubernetes:
    name: Kubernetes (kind) smoke test
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t drupal-multisite:ci .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: smoke

      - name: Load image into kind
        run: kind load docker-image drupal-multisite:ci --name smoke

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy chart and test
        run: tests/k8s/smoke.sh 2>&1 | tee "$RUNNER_TEMP/k8s-smoke.log"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n drupal-smoke get all,pvc,events --sort-by=.metadata.creationTimestamp || true
          kubectl -n drupal-smoke describe pods || true
          kubectl -n drupal-smoke logs deploy/drupal --tail=200 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8s-smoke-log
          path: ${{ runner.temp }}/k8s-smoke.log
